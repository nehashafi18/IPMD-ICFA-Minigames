services:
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: ic-fineart-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

  backend:
    build: 
      context: ../backend
      dockerfile: Dockerfile
    container_name: ic-fineart-backend
    ports:
      - "5001:5001"
    env_file:
      - ../backend/.env

    environment:
      - PORT=5001

      # Stable Diffusion
      - SD_TXT2IMG_URL=http://sd-backend:8000/generate-text-to-image
      - SD_IMG2IMG_URL=http://sd-backend:8000/generate-image-to-image

      # Qwen / Ollama
      - LLM_PROVIDER=qwen
      - QWEN_API_KEY=ollama
      - QWEN_BASE_URL=http://ollama:11434/v1
      - QWEN_MODEL=qwen3.5:2b

    volumes:
      - ../backend/uploads:/app/uploads
      - ../backend/outputs:/app/outputs

    depends_on:
      - sd-backend
      - ollama

  sd-backend:
    build:
      context: ../sd-backend
      dockerfile: Dockerfile
    container_name: ic-fineart-sd-backend

    ports:
      - "8000:8000"

    volumes:
      - ~/hf_cache:/root/.cache/huggingface
      - ../sd-backend/outputs:/app/outputs

  ollama:
    image: ollama/ollama
    container_name: ic-fineart-ollama

    ports:
      - "11434:11434"

    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data: